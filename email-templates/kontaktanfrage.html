<!-- EmailJS template: Kontaktanfrage (Kontakt section + floating button). Paste into Email Templates → Content → Code Editor. -->
<div style="margin:0;padding:24px 12px;background:#F8F5EC;font-family:Arial,Helvetica,sans-serif;color:#221D14;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#FFFFFF;border:1px solid #E6DFCC;border-radius:8px;overflow:hidden;">
    <tr>
      <td style="background:#1A1712;padding:28px 32px;">
        <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:4px;color:#D4B173;">NOVUS</div>
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#A69984;margin-top:4px;">Bauunternehmung</div>
      </td>
    </tr>
    <tr><td style="height:3px;background:#9C7A38;line-height:3px;font-size:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:32px 32px 8px;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9C7A38;font-weight:bold;">Neue Nachricht · {{quelle}}</div>
        <h1 style="margin:8px 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:normal;color:#221D14;">{{name}}</h1>
        <div style="font-size:14px;color:#6B6252;">über das Kontaktformular der Website</div>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 8px;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6B6252;margin-bottom:10px;">Nachricht</div>
        <div style="background:#F8F5EC;border-left:3px solid #9C7A38;padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-line;">{{nachricht}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 8px;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6B6252;margin-bottom:10px;">Kontakt</div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;border-collapse:collapse;">
          <tr><td style="padding:10px 0;border-bottom:1px solid #EFE9DA;color:#6B6252;width:130px;">E-Mail</td><td style="padding:10px 0;border-bottom:1px solid #EFE9DA;"><a href="mailto:{{email}}" style="color:#9C7A38;">{{email}}</a></td></tr>
          <tr><td style="padding:10px 0;color:#6B6252;">Telefon</td><td style="padding:10px 0;">{{telefon}}</td></tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="background:#9C7A38;border-radius:4px;"><a href="mailto:{{email}}?subject=Ihre%20Nachricht%20an%20NOVUS" style="display:inline-block;padding:12px 22px;color:#FFFFFF;font-size:14px;font-weight:bold;text-decoration:none;">Antworten</a></td>
        </tr></table>
      </td>
    </tr>
    <tr>
      <td style="background:#F8F5EC;padding:16px 32px;font-size:12px;color:#6B6252;border-top:1px solid #E6DFCC;">
        Automatisch gesendet über novus-bauunternehmung.de · „Antworten" geht direkt an den Kunden.
      </td>
    </tr>
  </table>
</div>
